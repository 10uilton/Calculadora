<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .app {
    height: 100dvh;
    width: 100vw;
    background: linear-gradient(160deg, #232326 0%, #131315 55%, #0a0a0b 100%);
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 14px);
    display: flex;
    flex-direction: column;
    transition: background 0.35s ease;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 14px;
    flex-shrink: 0;
    position: relative;
  }

  .led-housing {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 32% 28%, #2c2d31, #08090a 75%);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.7),
      inset 0 1px 1px rgba(255,255,255,0.06),
      inset 0 -1px 2px rgba(0,0,0,0.8);
  }

  .led {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #1f3d3a, #0a1615 75%);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.6);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .led.on {
    background: radial-gradient(circle at 35% 28%, #baffe0 0%, #35f2b0 45%, #0bd190 75%);
    box-shadow:
      0 0 6px 2px rgba(53,242,176,0.9),
      0 0 16px 5px rgba(53,242,176,0.55),
      inset 0 0 2px rgba(255,255,255,0.5);
    animation: ledBlink 0.9s steps(1, end) 1;
  }

  @keyframes ledBlink {
    0%   { opacity: 1; }
    16%  { opacity: 0.15; }
    33%  { opacity: 1; }
    50%  { opacity: 0.15; }
    66%  { opacity: 1; }
    83%  { opacity: 0.15; }
    100% { opacity: 1; }
  }

  .brand {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 2.5px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 0 8px rgba(255,212,0,0.65), 0 0 16px rgba(255,212,0,0.35);
  }

  .brand-link {
    color: inherit;
    text-decoration: none;
  }

  .footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    padding-top: 6px;
  }

  .footer a {
    color: #ffd400;
    text-decoration: none;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 10px;
    color: #ececef;
    background: linear-gradient(180deg, #3d3d42 0%, #232326 100%);
    box-shadow:
      0 2px 0 rgba(0,0,0,0.55),
      0 3px 6px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -4px 6px rgba(0,0,0,0.25);
    transition: transform .04s ease, box-shadow .04s ease;
  }

  .color-btn:active {
    transform: translateY(1px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 4px rgba(0,0,0,0.25);
  }

  .screen-wrap {
    background: #05070a;
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 6px 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 0 0 1px #000;
    flex-shrink: 0;
  }

  .screen {
    background: linear-gradient(180deg, #a9c3ae 0%, #93b298 100%);
    border-radius: 4px;
    padding: 14px 12px 10px;
    height: 84px;
    min-height: 84px;
    max-height: 84px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .screen-sub {
    font-family: 'DSEG7 Classic', monospace;
    font-size: 13px;
    color: #3a4a3d;
    opacity: 0.75;
    height: 14px;
    min-height: 14px;
    letter-spacing: 1px;
  }

  .screen-main {
    font-family: 'DSEG7 Classic', monospace;
    font-size: 40px;
    line-height: 1.05;
    height: 42px;
    color: #21301f;
    letter-spacing: 1px;
    width: 100%;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
  }

  .keys {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 10px;
    padding: 0 4px;
    margin-bottom: 34px;
    min-height: 0;
  }

  button {
    border: none;
    border-radius: 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #ececef;
    background: linear-gradient(180deg, #3d3d42 0%, #232326 100%);
    box-shadow:
      0 3px 0 rgba(0,0,0,0.55),
      0 5px 8px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -6px 10px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .04s ease, box-shadow .04s ease;
    padding: 0;
  }

  button:active {
    transform: translateY(2px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -3px 6px rgba(0,0,0,0.3);
  }

  .btn-ghost {
    background: linear-gradient(180deg, #2b2c30 0%, #1c1c1f 100%);
    color: #c9cad0;
    font-size: 13px;
  }

  .btn-op {
    background: linear-gradient(180deg, #3a3d44 0%, #24262b 100%);
    color: #f2c94c;
    font-size: 19px;
  }

  .btn-fn {
    background: linear-gradient(180deg, #34363b 0%, #202226 100%);
    color: #9fd8c9;
    font-size: 16px;
  }

  .btn-onoff {
    background: linear-gradient(180deg, #ff6b6b 0%, #d6362e 100%);
    color: #fff;
    font-size: 12px;
    line-height: 1.2;
    box-shadow: 0 3px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-onoff:active { box-shadow: 0 1px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.2); }

  .btn-off {
    background: linear-gradient(180deg, #45474c 0%, #28292d 100%);
    color: #e7e7ea;
    font-size: 14px;
  }

  .btn-plus {
    background: linear-gradient(180deg, #ff6b6b 0%, #d6362e 100%);
    color: #fff;
    font-size: 19px;
    box-shadow: 0 3px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-plus:active { box-shadow: 0 1px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.2); }

  @keyframes cur{50%{opacity:0}}
  .mcard{height:120px;flex-direction:column;gap:8px;font-size:17px;margin:0 6px}

  .lcd{background:linear-gradient(180deg,#cfe0d8,#b8cec3);border-radius:4px;padding:6px 10px 8px;height:116px;display:flex;flex-direction:column;color:#1d2a22;box-shadow:inset 0 2px 5px rgba(0,0,0,.25);overflow:hidden}

  /* ===== 3D: calculadoras giram com os dedos ===== */

  /* verso realista: tampa das pilhas, marca, etiqueta e pezinhos */

    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.2)),var(--side,#222)}

    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(0,0,0,.6));box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .bk-screw::after{content:'';position:absolute;left:2px;right:2px;top:5.5px;height:2px;background:rgba(0,0,0,.65);transform:rotate(35deg)}
  .bk-screw.a{left:14px;bottom:14px}.bk-screw.b{right:14px;bottom:14px}
  .bk-label{position:absolute;left:11%;right:11%;bottom:7.5%;border-radius:8px;padding:10px 12px;
    background:rgba(250,250,250,.9);color:#25252a;font:600 10px/1.5 ui-monospace,Menlo,monospace;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .bk-label b{font-size:11px}
  .bk-foot{position:absolute;bottom:2.6%;width:38px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}
  .bk-foot.l{left:7%}.bk-foot.r{right:7%}
  .bk-foot.tl{top:2.6%;bottom:auto;left:7%}.bk-foot.tr{top:2.6%;bottom:auto;right:7%}
  /* menu: miniaturas 3D girando sozinhas */
  #imgNormal,#imgSci{perspective:800px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .m3d{position:relative;width:112px;height:160px;transform-style:preserve-3d;animation:spin3d 9s linear infinite}
  @keyframes spin3d{from{transform:rotateX(-12deg) rotateY(0deg)}to{transform:rotateX(-12deg) rotateY(360deg)}}
  .m3d>*{position:absolute;inset:0;border-radius:15px}
  .m3d .ml{background:#3a3a41;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}

<script>
  let current = '0';
  let tokens = []; // sequência de números e operadores já confirmados, ex: ['9','−','6','+']
  let overwrite = true;
  let memory = 0;
  let isOn = true;
  let locked = false; // true durante a transição de 3s mostrando ON/OFF na tela

  const OPS = ['+', '−', '×', '÷'];
  const isOperator = t => OPS.includes(t);

  const mainDisplay = document.getElementById('mainDisplay');
  const subDisplay = document.getElementById('subDisplay');
  const statusLed = document.getElementById('statusLed');
  const appRoot = document.getElementById('appRoot');

  const COLORS = [
    { name: 'Preta',     grad: 'linear-gradient(160deg, #232326 0%, #131315 55%, #0a0a0b 100%)' },
    { name: 'Branca',    grad: 'linear-gradient(160deg, #f4f4f6 0%, #dcdde0 55%, #c4c5c9 100%)' },
    { name: 'Prateada',  grad: 'linear-gradient(160deg, #e3e4e7 0%, #b8bac0 55%, #8d8f95 100%)' },
    { name: 'Azul',      grad: 'linear-gradient(160deg, #3f74b0 0%, #244f80 55%, #12314f 100%)' },
    { name: 'Vermelha',  grad: 'linear-gradient(160deg, #d94a41 0%, #a72922 55%, #711712 100%)' },
    { name: 'Verde',     grad: 'linear-gradient(160deg, #42a463 0%, #257c40 55%, #144e26 100%)' },
    { name: 'Amarela',   grad: 'linear-gradient(160deg, #f2d24c 0%, #d9ab1f 55%, #a3790f 100%)' },
    { name: 'Roxa',      grad: 'linear-gradient(160deg, #8d54d6 0%, #632aa8 55%, #401a6e 100%)' },
    { name: 'Rosa',      grad: 'linear-gradient(160deg, #f284b3 0%, #d95590 55%, #a13564 100%)' },
    { name: 'Laranja',   grad: 'linear-gradient(160deg, #f2933f 0%, #d76f1c 55%, #a1500f 100%)' },
    { name: 'Cinza',     grad: 'linear-gradient(160deg, #808388 0%, #5a5c60 55%, #37383b 100%)' },
    { name: 'Marrom',    grad: 'linear-gradient(160deg, #8a6142 0%, #5f3f27 55%, #3a2417 100%)' },
  ];

  let colorIndex = 0;
  const savedColorIndex = parseInt(localStorage.getItem('calc-color-index'), 10);
  if (!isNaN(savedColorIndex) && COLORS[savedColorIndex]) colorIndex = savedColorIndex;

  function applyColor(i) {
    colorIndex = i;
    appRoot.querySelector('.slab').style.background = COLORS[i].grad;
    localStorage.setItem('calc-color-index', String(i));
  }

  function cycleColor() {
    applyColor((colorIndex + 1) % COLORS.length);
  }

  applyColor(colorIndex);

  // --- Som das teclas ---
  let soundOn = true;
  const savedSound = localStorage.getItem('calc-sound-on');
  if (savedSound !== null) soundOn = savedSound === '1';

  const soundBtn = document.getElementById('soundBtn');
  const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 5M21 9l-5 5"/></svg>';

  function renderSoundIcon() {
    soundBtn.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
    const s2 = document.getElementById('sSound'); if (s2) s2.innerHTML = soundBtn.innerHTML;
  }
  renderSoundIcon();

  function toggleSound() {
    soundOn = !soundOn;
    localStorage.setItem('calc-sound-on', soundOn ? '1' : '0');
    renderSoundIcon();
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playClick(type) {
    if (!soundOn) return;
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      let freq = 950;
      if (type === 'op') freq = 700;
      if (type === 'fn') freq = 880;
      if (type === 'eq') freq = 1250;
      if (type === 'power') freq = 500;
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  document.querySelector('.keys').addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    let type = 'digit';
    if (btn.textContent.trim() === '=') type = 'eq';
    else if (btn.classList.contains('btn-op') || btn.classList.contains('btn-plus')) type = 'op';
    else if (btn.classList.contains('btn-fn') || btn.classList.contains('btn-ghost')) type = 'fn';
    else if (btn.classList.contains('btn-onoff') || btn.classList.contains('btn-off')) type = 'power';
    playClick(type);
  });

  function blinkLed() {
    statusLed.classList.remove('on');
    // force reflow so the animation restarts even on rapid repeated presses
    void statusLed.offsetWidth;
    statusLed.classList.add('on');
  }

  statusLed.addEventListener('animationend', () => {
    statusLed.classList.remove('on');
  });

  function adjustFont(text) {
    let size = 40;
    if (text.length > 13) size = 32;
    if (text.length > 17) size = 22;
    mainDisplay.style.fontSize = size + 'px';
  }

  function render() {
    let text;
    if (tokens.length === 0) {
      // sem expressão em andamento: só o número atual
      text = current;
      subDisplay.textContent = '\u00A0';
    } else {
      // expressão completa em construção, ex: "34+8" ou "9−6+8"
      text = tokens.join('') + current;
      subDisplay.textContent = '\u00A0';
    }
    mainDisplay.textContent = text;
    adjustFont(text);
    mainDisplay.scrollTop = mainDisplay.scrollHeight; // mantém o fim da conta sempre visível
  }

  function inputDigit(d) {
    if (!isOn || locked) return;
    if (overwrite) {

  }

    if (!isOn || locked) return;

    }

  }

  function onCE() {
    if (!isOn || locked) return;
    current = '0'; tokens = []; overwrite = true;
    render();
  }

  function togglePower() {
    if (locked) return;
    locked = true;
    clearTimeout(togglePower._timer);

    if (isOn) {
      // Desligando: mostra "OFF" por 3s e depois some tudo, igual estava desligada
      isOn = false;
      statusLed.classList.remove('on');
      mainDisplay.style.fontSize = '32px';
      mainDisplay.textContent = 'OFF';
      subDisplay.textContent = '\u00A0';

      togglePower._timer = setTimeout(() => {
        mainDisplay.textContent = '\u00A0';
        subDisplay.textContent = '\u00A0';
        current = '0'; tokens = []; overwrite = true;
        locked = false;
      }, 3000);
    } else {
      // Ligando: mostra "ON" por 3s e depois volta pro 0, igual quando reinicia
      isOn = true;
      mainDisplay.style.fontSize = '32px';
      mainDisplay.textContent = 'ON';
      subDisplay.textContent = '\u00A0';

      togglePower._timer = setTimeout(() => {
        current = '0'; tokens = []; overwrite = true;
        render();
        locked = false;
      }, 3000);
    }
  }

  function chooseOp(op) {
    if (!isOn || locked) return;
    if (tokens.length && isOperator(tokens[tokens.length - 1]) && overwrite) {
      // acabou de apertar um operador: troca ele em vez de duplicar
      tokens[tokens.length - 1] = op;
    } else {
      tokens.push(current);
      tokens.push(op);
      overwrite = true;
      current = ''; // some do visor até o próximo número ser digitado

  }

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);

      case '−': return a - b;

      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function equals() {
    if (!isOn || locked) return;
    if (tokens.length === 0 || current === '') return;
    const full = tokens.concat([current]);
    let result = parseFloat(full[0]);
    for (let i = 1; i < full.length; i += 2) {
      result = compute(result, full[i + 1], full[i]);
      if (isNaN(result)) break;
    }
    const exprText = full.join('');
    current = isNaN(result) ? 'Error' : String(parseFloat(result.toFixed(8)));
    tokens = [];
    overwrite = true;

    // expressão sobe pro visor pequeno, resultado desce pro visor grande
    subDisplay.textContent = exprText + '=';
    mainDisplay.textContent = current;
    adjustFont(current);

  }

  function percent() {
    if (!isOn || locked) return;

  }

  function mMinus() { if (!isOn || locked) return; memory -= parseFloat(current); overwrite = true; }
  function mrc() { if (!isOn || locked) return; current = String(memory); overwrite = true; render(); }

  render();

  // Versão do app: quando muda, limpa o cache antigo e recarrega uma vez
  const APP_VER = '1.4';
  let freshLoad = true;

    if (localStorage.getItem('calc-ver') !== APP_VER) {

    navigator.serviceWorker.register('service-worker.js').catch(() => {});

<script>
(() => {
  const N = 12, DEPTH = 30;
  function sideFromGrad(g) {
    const m = (g.match(/#[0-9a-f]{6}/gi) || ['#222222']);
    const h = m[Math.min(1, m.length - 1)];
    const r = parseInt(h.slice(1,3),16), gr = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    const k = 0.7, lum = (0.299*r + 0.587*gr + 0.114*b) / 255;
    return { side: `rgb(${r*k|0},${gr*k|0},${b*k|0})`, ink: lum > 0.55 ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.7)' };
  }

  const backHTML = sci => `<div class="bk">
    <i class="bk-foot tl"></i><i class="bk-foot tr"></i>
    <div class="bk-brand">10uilton</div>
    <div class="bk-sub">${sci ? 'CALCULADORA CIENTÍFICA' : 'CALCULADORA'}</div>
    <div class="bk-lid"><div class="bk-grip"></div><div class="bk-arrow">◄ ABRIR · OPEN</div>
      <div class="bk-bat">2 × AAA &nbsp;1,5 V</div><div class="bk-pol"><span>+</span><span>−</span></div>
      <i class="bk-screw a"></i><i class="bk-screw b"></i></div>
    <div class="bk-label"><b>MODELO ${sci ? '10U-S570' : '10U-N100'}</b><br>ALIMENTAÇÃO: 2 × AAA 1,5 V<br>10uilton.blogspot.com</div>
    <i class="bk-foot l"></i><i class="bk-foot r"></i></div>`;
  const norm = a => ((a % 360) + 540) % 360 - 180;

  function init(stage) {
    const scene = stage.querySelector('.scene'), slab = stage.querySelector('.slab'), rst = stage.querySelector('.rst');
    // espessura: camadas empilhadas (bordas arredondadas)
    for (let i = 0; i < N; i++) {
      const l = document.createElement('div'); l.className = 'layer';
      const z = -DEPTH/2 + 2 + (DEPTH - 4) * i / (N - 1);
      l.style.transform = `translateZ(${z.toFixed(2)}px)`;
      scene.insertBefore(l, slab);
    }
    const back = document.createElement('div'); back.className = 'layer back'; back.innerHTML = backHTML(stage.id === 'sciRoot');
    scene.insertBefore(back, scene.firstChild);

    const sync = () => {
      const c = sideFromGrad(slab.style.background || '');
      scene.style.setProperty('--side', c.side); scene.style.setProperty('--ink', c.ink);
    };
    new MutationObserver(sync).observe(slab, { attributes: true, attributeFilter: ['style'] });
    sync();

    let rx = 0, ry = 0, vx = 0, vy = 0, id = null, drag = false, suppress = false, sx, sy, lx, ly, lt, raf = 0;
    const apply = () => {
      const sc = 1 - 0.1 * Math.min(1, (Math.abs(norm(rx)) + Math.abs(norm(ry))) / 40);
      scene.style.transform = `scale3d(${sc},${sc},${sc}) rotateX(${rx}deg) rotateY(${ry}deg)`;
      scene.style.setProperty('--sx', (-Math.sin(ry * Math.PI/180) * 70 + Math.sin(rx * Math.PI/180) * 30).toFixed(1));
      rst.classList.toggle('show', Math.abs(norm(rx)) > 3 || Math.abs(norm(ry)) > 3);
    };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; scene.style.transition = ''; };
    const glide = () => {
      vx *= 0.94; vy *= 0.94;
      if (Math.abs(vx) < 0.01 && Math.abs(vy) < 0.01) { raf = 0; return; }
      rx += vy * 16; ry += vx * 16; apply(); raf = requestAnimationFrame(glide);
    };

    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('.rst') || e.target.closest('#sMod')) return;
      stop(); id = e.pointerId; drag = false; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); vx = vy = 0;
    });
    stage.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      if (!drag) {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) < 8) return;
        drag = true; lx = e.clientX; ly = e.clientY; stage.classList.add('grabbing');
        try { stage.setPointerCapture(id); } catch (_) {}
      }
      const now = performance.now(), dt = Math.max(1, now - lt);
      const dx = e.clientX - lx, dy = e.clientY - ly;
      ry += dx * 0.45; rx -= dy * 0.45;
      vx = 0.7 * vx + 0.3 * (dx * 0.45 / dt); vy = 0.7 * vy + 0.3 * (-dy * 0.45 / dt);
      lx = e.clientX; ly = e.clientY; lt = now; apply();
    });
    const end = e => {
      if (e.pointerId !== id) return;
      id = null; stage.classList.remove('grabbing');
      if (drag) {
        suppress = true; setTimeout(() => suppress = false, 0);
        if (performance.now() - lt < 80) raf = requestAnimationFrame(glide);
      }
      drag = false;
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    stage.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);

    rst.addEventListener('click', () => {
      stop();
      rx = Math.round(rx / 360) * 360; ry = Math.round(ry / 360) * 360;
      scene.style.transition = 'transform .6s cubic-bezier(.2,.8,.2,1)'; apply();
      setTimeout(() => { scene.style.transition = ''; rx = ry = 0; apply(); }, 650);
    });
    apply();
  }
  document.querySelectorAll('.app.stage').forEach(init);
})();
</script>

    let o = frame('<rect x="7" y="8" width="56" height="20" rx="2" fill="#a9c3ae"/>');
    const kw = 12, kh = 9, y0 = 34, gx = (56 - 4 * kw) / 3, gy = (95 - y0 - 6 * kh) / 5;
    rows.forEach((r, i) => r.forEach(([l, f, c, fs], j) => { o += kEl(7 + j * (kw + gx), y0 + i * (kh + gy), kw, kh, f, l, c, fs, 2.5); }));
    return o + '</svg>';
  }

  function sciSVG() {
    const TOP = '#2e2f33', DG = '#44444a', Y = '#f2c94c', W = '#ececef';
    const R = [
      ['t', 'SHIFT', 'ALPHA', '◀', '▶', 'MODE'],
      ['t', 'CALC', '∫', 'x⁻¹', 'logₐ', 'a/b'],
      ['t', '√', 'x²', 'xʸ', 'log', 'ln'],
      ['t', '(−)', '°′″', 'hyp', 'sin', 'cos', 'tan'],
      ['t', 'RCL', 'ENG', '(', ')', 'S⇔D', 'M+'],
      ['d', '7', '8', '9', 'DEL', 'AC'],
      ['d', '4', '5', '6', '×', '÷'],
      ['d', '1', '2', '3', '+', '−'],
      ['d', '0', '.', '×10ˣ', 'Ans', '='],
    ];
    let o = frame('<rect x="7" y="7" width="56" height="22" rx="2" fill="#a9c3ae"/>');
    const gap = 1.1, hT = 5.2, hD = 7.2, y0 = 33.5;
    let y = y0;
    R.forEach(row => {
      const kind = row[0], labels = row.slice(1), n = labels.length, h = kind === 'd' ? hD : hT;
      const w = (56 - (n - 1) * gap) / n;
      labels.forEach((l, j) => {
        let fill = kind === 'd' ? DG : TOP, col = W;
        if ('×÷+−'.includes(l) && l.length === 1) col = Y;
        if (l === '=') { fill = '#e0463e'; }
        if (l === 'DEL' || l === 'AC') { fill = '#8cc63a'; col = '#10200a'; }
        const L = l.length;
        const fs = kind === 'd' ? (L === 1 ? 4.6 : L <= 3 ? 3.4 : 2.8) : (L === 1 ? 3.6 : L <= 3 ? 3.1 : L === 4 ? 2.6 : 2.3);
        o += kEl(7 + j * (w + gap), y, w, h, fill, l, col, fs, kind === 'd' ? 2 : 1.6);
      });
      y += h + gap;
    });
    return o + '</svg>';
  }
  document.getElementById('imgNormal').innerHTML = normalSVG();
  document.getElementById('imgSci').innerHTML = sciSVG();
  make3d('imgNormal', '0s'); make3d('imgSci', '0s');
})();
</script>
