<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Calculadora Elgin</title>

<!-- App / home screen behavior -->
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DSEG7+Classic:wght@700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0d;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .app {
    height: 100dvh;
    width: 100vw;
    background: linear-gradient(160deg, #232326 0%, #131315 55%, #0a0a0b 100%);
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 14px);
    display: flex;
    flex-direction: column;
    transition: background 0.35s ease;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 14px;
    flex-shrink: 0;
    position: relative;
  }

  .led-housing {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 32% 28%, #2c2d31, #08090a 75%);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.7),
      inset 0 1px 1px rgba(255,255,255,0.06),
      inset 0 -1px 2px rgba(0,0,0,0.8);
  }

  .led {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #1f3d3a, #0a1615 75%);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.6);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .led.on {
    background: radial-gradient(circle at 35% 28%, #baffe0 0%, #35f2b0 45%, #0bd190 75%);
    box-shadow:
      0 0 6px 2px rgba(53,242,176,0.9),
      0 0 16px 5px rgba(53,242,176,0.55),
      inset 0 0 2px rgba(255,255,255,0.5);
    animation: ledBlink 0.9s steps(1, end) 1;
  }

  @keyframes ledBlink {
    0%   { opacity: 1; }
    16%  { opacity: 0.15; }
    33%  { opacity: 1; }
    50%  { opacity: 0.15; }
    66%  { opacity: 1; }
    83%  { opacity: 0.15; }
    100% { opacity: 1; }
  }

  .brand {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 2.5px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 0 8px rgba(255,212,0,0.65), 0 0 16px rgba(255,212,0,0.35);
  }

  .brand-link {
    color: inherit;
    text-decoration: none;
  }

  .footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    padding-top: 6px;
  }

  .footer a {
    color: #ffd400;
    text-decoration: none;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 10px;
    color: #ececef;
    background: linear-gradient(180deg, #3d3d42 0%, #232326 100%);
    box-shadow:
      0 2px 0 rgba(0,0,0,0.55),
      0 3px 6px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -4px 6px rgba(0,0,0,0.25);
    transition: transform .04s ease, box-shadow .04s ease;
  }

  .color-btn:active {
    transform: translateY(1px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 4px rgba(0,0,0,0.25);
  }

  .screen-wrap {
    background: #05070a;
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 6px 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), inset 0 0 0 1px #000;
    flex-shrink: 0;
  }

  .screen {
    background: linear-gradient(180deg, #a9c3ae 0%, #93b298 100%);
    border-radius: 4px;
    padding: 14px 12px 10px;
    height: 84px;
    min-height: 84px;
    max-height: 84px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .screen-sub {
    font-family: 'DSEG7 Classic', monospace;
    font-size: 13px;
    color: #3a4a3d;
    opacity: 0.75;
    height: 14px;
    min-height: 14px;
    letter-spacing: 1px;
  }

  .screen-main {
    font-family: 'DSEG7 Classic', monospace;
    font-size: 40px;
    line-height: 1.05;
    height: 42px;
    color: #21301f;
    letter-spacing: 1px;
    width: 100%;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
  }

  .keys {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 10px;
    padding: 0 4px;
    margin-bottom: 34px;
    min-height: 0;
  }

  button {
    border: none;
    border-radius: 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #ececef;
    background: linear-gradient(180deg, #3d3d42 0%, #232326 100%);
    box-shadow:
      0 3px 0 rgba(0,0,0,0.55),
      0 5px 8px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -6px 10px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .04s ease, box-shadow .04s ease;
    padding: 0;
  }

  button:active {
    transform: translateY(2px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -3px 6px rgba(0,0,0,0.3);
  }

  .btn-ghost {
    background: linear-gradient(180deg, #2b2c30 0%, #1c1c1f 100%);
    color: #c9cad0;
    font-size: 13px;
  }

  .btn-op {
    background: linear-gradient(180deg, #3a3d44 0%, #24262b 100%);
    color: #f2c94c;
    font-size: 19px;
  }

  .btn-fn {
    background: linear-gradient(180deg, #34363b 0%, #202226 100%);
    color: #9fd8c9;
    font-size: 16px;
  }

  .btn-onoff {
    background: linear-gradient(180deg, #ff6b6b 0%, #d6362e 100%);
    color: #fff;
    font-size: 12px;
    line-height: 1.2;
    box-shadow: 0 3px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-onoff:active { box-shadow: 0 1px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.2); }

  .btn-off {
    background: linear-gradient(180deg, #45474c 0%, #28292d 100%);
    color: #e7e7ea;
    font-size: 14px;
  }

  .btn-plus {
    background: linear-gradient(180deg, #ff6b6b 0%, #d6362e 100%);
    color: #fff;
    font-size: 19px;
    box-shadow: 0 3px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-plus:active { box-shadow: 0 1px 0 #7a1c17, inset 0 1px 0 rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="app" id="appRoot">
  <div class="brand-row">
    <button class="color-btn" id="colorBtn" onclick="cycleColor()">C</button>
    <div class="brand-group">
      <div class="led-housing"><div class="led" id="statusLed"></div></div>
      <div class="brand"><a href="https://10uilton.blogspot.com" target="_blank" rel="noopener" class="brand-link">10uilton</a></div>
    </div>
    <button class="color-btn" id="soundBtn" onclick="toggleSound()" aria-label="Som"></button>
  </div>

  <div class="screen-wrap">
    <div class="screen">
      <div class="screen-sub" id="subDisplay">&nbsp;</div>
      <div class="screen-main" id="mainDisplay">0</div>
    </div>
  </div>

  <div class="keys">
    <!-- Row 1 -->
    <button class="btn-onoff" style="grid-column:1; grid-row:1;" onclick="onCE()">ON<br>C/CE</button>
    <button class="btn-ghost" style="grid-column:2; grid-row:1;" onclick="mrc()">MRC</button>
    <button class="btn-ghost" style="grid-column:3; grid-row:1;" onclick="mMinus()">M-</button>
    <button class="btn-ghost" style="grid-column:4; grid-row:1;" onclick="mPlus()">M+</button>

    <!-- Row 2 -->
    <button class="btn-off" style="grid-column:1; grid-row:2;" onclick="togglePower()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v7.5"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
    <button class="btn-fn" style="grid-column:2; grid-row:2;" onclick="sqrt()">&radic;</button>
    <button class="btn-fn" style="grid-column:3; grid-row:2;" onclick="percent()">%</button>
    <button class="btn-op" style="grid-column:4; grid-row:2;" onclick="chooseOp('÷')">&divide;</button>

    <!-- Row 3 -->
    <button style="grid-column:1; grid-row:3;" onclick="inputDigit('7')">7</button>
    <button style="grid-column:2; grid-row:3;" onclick="inputDigit('8')">8</button>
    <button style="grid-column:3; grid-row:3;" onclick="inputDigit('9')">9</button>
    <button class="btn-op" style="grid-column:4; grid-row:3;" onclick="chooseOp('×')">&times;</button>

    <!-- Row 4 -->
    <button style="grid-column:1; grid-row:4;" onclick="inputDigit('4')">4</button>
    <button style="grid-column:2; grid-row:4;" onclick="inputDigit('5')">5</button>
    <button style="grid-column:3; grid-row:4;" onclick="inputDigit('6')">6</button>
    <button class="btn-op" style="grid-column:4; grid-row:4;" onclick="chooseOp('−')">&minus;</button>

    <!-- Row 5 -->
    <button style="grid-column:1; grid-row:5;" onclick="inputDigit('1')">1</button>
    <button style="grid-column:2; grid-row:5;" onclick="inputDigit('2')">2</button>
    <button style="grid-column:3; grid-row:5;" onclick="inputDigit('3')">3</button>
    <button class="btn-fn" style="grid-column:4; grid-row:5;" onclick="backspace()">&larr;</button>

    <!-- Row 6 -->
    <button style="grid-column:1; grid-row:6;" onclick="inputDigit('0')">0</button>
    <button style="grid-column:2; grid-row:6;" onclick="inputDigit('.')">.</button>
    <button class="btn-op" style="grid-column:3; grid-row:6;" onclick="equals()">=</button>
    <button class="btn-plus" style="grid-column:4; grid-row:6;" onclick="chooseOp('+')">+</button>
  </div>

  <div class="footer">
    Desenvolvido por <a href="https://10uilton.blogspot.com" target="_blank" rel="noopener">10uilton</a>
  </div>
</div>

<script>
  let current = '0';
  let tokens = []; // sequência de números e operadores já confirmados, ex: ['9','−','6','+']
  let overwrite = true;
  let memory = 0;
  let isOn = true;
  let locked = false; // true durante a transição de 3s mostrando ON/OFF na tela

  const OPS = ['+', '−', '×', '÷'];
  const isOperator = t => OPS.includes(t);

  const mainDisplay = document.getElementById('mainDisplay');
  const subDisplay = document.getElementById('subDisplay');
  const statusLed = document.getElementById('statusLed');
  const appRoot = document.getElementById('appRoot');

  const COLORS = [
    { name: 'Preta',     grad: 'linear-gradient(160deg, #232326 0%, #131315 55%, #0a0a0b 100%)' },
    { name: 'Branca',    grad: 'linear-gradient(160deg, #f4f4f6 0%, #dcdde0 55%, #c4c5c9 100%)' },
    { name: 'Prateada',  grad: 'linear-gradient(160deg, #e3e4e7 0%, #b8bac0 55%, #8d8f95 100%)' },
    { name: 'Azul',      grad: 'linear-gradient(160deg, #3f74b0 0%, #244f80 55%, #12314f 100%)' },
    { name: 'Vermelha',  grad: 'linear-gradient(160deg, #d94a41 0%, #a72922 55%, #711712 100%)' },
    { name: 'Verde',     grad: 'linear-gradient(160deg, #42a463 0%, #257c40 55%, #144e26 100%)' },
    { name: 'Amarela',   grad: 'linear-gradient(160deg, #f2d24c 0%, #d9ab1f 55%, #a3790f 100%)' },
    { name: 'Roxa',      grad: 'linear-gradient(160deg, #8d54d6 0%, #632aa8 55%, #401a6e 100%)' },
    { name: 'Rosa',      grad: 'linear-gradient(160deg, #f284b3 0%, #d95590 55%, #a13564 100%)' },
    { name: 'Laranja',   grad: 'linear-gradient(160deg, #f2933f 0%, #d76f1c 55%, #a1500f 100%)' },
    { name: 'Cinza',     grad: 'linear-gradient(160deg, #808388 0%, #5a5c60 55%, #37383b 100%)' },
    { name: 'Marrom',    grad: 'linear-gradient(160deg, #8a6142 0%, #5f3f27 55%, #3a2417 100%)' },
  ];

  let colorIndex = 0;
  const savedColorIndex = parseInt(localStorage.getItem('calc-color-index'), 10);
  if (!isNaN(savedColorIndex) && COLORS[savedColorIndex]) colorIndex = savedColorIndex;

  function applyColor(i) {
    colorIndex = i;
    appRoot.style.background = COLORS[i].grad;
    localStorage.setItem('calc-color-index', String(i));
  }

  function cycleColor() {
    applyColor((colorIndex + 1) % COLORS.length);
  }

  applyColor(colorIndex);

  // --- Som das teclas ---
  let soundOn = true;
  const savedSound = localStorage.getItem('calc-sound-on');
  if (savedSound !== null) soundOn = savedSound === '1';

  const soundBtn = document.getElementById('soundBtn');
  const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 5M21 9l-5 5"/></svg>';

  function renderSoundIcon() {
    soundBtn.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
  }
  renderSoundIcon();

  function toggleSound() {
    soundOn = !soundOn;
    localStorage.setItem('calc-sound-on', soundOn ? '1' : '0');
    renderSoundIcon();
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playClick(type) {
    if (!soundOn) return;
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      let freq = 950;
      if (type === 'op') freq = 700;
      if (type === 'fn') freq = 880;
      if (type === 'eq') freq = 1250;
      if (type === 'power') freq = 500;
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  document.querySelector('.keys').addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    let type = 'digit';
    if (btn.textContent.trim() === '=') type = 'eq';
    else if (btn.classList.contains('btn-op') || btn.classList.contains('btn-plus')) type = 'op';
    else if (btn.classList.contains('btn-fn') || btn.classList.contains('btn-ghost')) type = 'fn';
    else if (btn.classList.contains('btn-onoff') || btn.classList.contains('btn-off')) type = 'power';
    playClick(type);
  });

  function blinkLed() {
    statusLed.classList.remove('on');
    // force reflow so the animation restarts even on rapid repeated presses
    void statusLed.offsetWidth;
    statusLed.classList.add('on');
  }

  statusLed.addEventListener('animationend', () => {
    statusLed.classList.remove('on');
  });

  function adjustFont(text) {
    let size = 40;
    if (text.length > 8)  size = 32;
    if (text.length > 12) size = 26;
    if (text.length > 16) size = 20;
    if (text.length > 20) size = 16;
    mainDisplay.style.fontSize = size + 'px';
  }

  function render() {
    let text;
    if (tokens.length === 0) {
      // sem expressão em andamento: só o número atual
      text = current.length > 10 ? parseFloat(current).toPrecision(8) : current;
      subDisplay.textContent = '\u00A0';
    } else {
      // expressão completa em construção, ex: "34+8" ou "9−6+8"
      text = tokens.join('') + current;
      subDisplay.textContent = '\u00A0';
    }
    mainDisplay.textContent = text;
    adjustFont(text);
  }

  function inputDigit(d) {
    if (!isOn || locked) return;
    if (overwrite) {
      current = (d === '.') ? '0.' : d;
      overwrite = false;
    } else {
      if (d === '.' && current.includes('.')) return;
      if (current.length >= 12) return;
      current = current === '0' && d !== '.' ? d : current + d;
    }
    render();
  }

  function backspace() {
    if (!isOn || locked) return;
    if (overwrite) return;
    if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) {
      current = '0';
    } else {
      current = current.slice(0, -1);
    }
    render();
  }

  function onCE() {
    if (!isOn || locked) return;
    current = '0'; tokens = []; overwrite = true;
    render();
  }

  function togglePower() {
    if (locked) return;
    locked = true;
    clearTimeout(togglePower._timer);

    if (isOn) {
      // Desligando: mostra "OFF" por 3s e depois some tudo, igual estava desligada
      isOn = false;
      statusLed.classList.remove('on');
      mainDisplay.style.fontSize = '32px';
      mainDisplay.textContent = 'OFF';
      subDisplay.textContent = '\u00A0';

      togglePower._timer = setTimeout(() => {
        mainDisplay.textContent = '\u00A0';
        subDisplay.textContent = '\u00A0';
        current = '0'; tokens = []; overwrite = true;
        locked = false;
      }, 3000);
    } else {
      // Ligando: mostra "ON" por 3s e depois volta pro 0, igual quando reinicia
      isOn = true;
      mainDisplay.style.fontSize = '32px';
      mainDisplay.textContent = 'ON';
      subDisplay.textContent = '\u00A0';

      togglePower._timer = setTimeout(() => {
        current = '0'; tokens = []; overwrite = true;
        render();
        locked = false;
      }, 3000);
    }
  }

  function chooseOp(op) {
    if (!isOn || locked) return;
    if (tokens.length && isOperator(tokens[tokens.length - 1]) && overwrite) {
      // acabou de apertar um operador: troca ele em vez de duplicar
      tokens[tokens.length - 1] = op;
    } else {
      tokens.push(current);
      tokens.push(op);
      overwrite = true;
      current = ''; // some do visor até o próximo número ser digitado
    }
    render();
  }

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    switch(op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function equals() {
    if (!isOn || locked) return;
    if (tokens.length === 0 || current === '') return;
    const full = tokens.concat([current]);
    let result = parseFloat(full[0]);
    for (let i = 1; i < full.length; i += 2) {
      result = compute(result, full[i + 1], full[i]);
      if (isNaN(result)) break;
    }
    const exprText = full.join('');
    current = isNaN(result) ? 'Error' : String(parseFloat(result.toFixed(8)));
    tokens = [];
    overwrite = true;

    // expressão sobe pro visor pequeno, resultado desce pro visor grande
    subDisplay.textContent = exprText + '=';
    mainDisplay.textContent = current;
    adjustFont(current);
    blinkLed();
  }

  function percent() {
    if (!isOn || locked) return;
    current = String(parseFloat(current) / 100);
    overwrite = true;
    render();
  }

  function sqrt() {
    if (!isOn || locked) return;
    const v = parseFloat(current);
    current = v < 0 ? 'Error' : String(parseFloat(Math.sqrt(v).toFixed(8)));
    overwrite = true;
    render();
  }

  function mPlus() { if (!isOn || locked) return; memory += parseFloat(current); overwrite = true; }
  function mMinus() { if (!isOn || locked) return; memory -= parseFloat(current); overwrite = true; }
  function mrc() { if (!isOn || locked) return; current = String(memory); overwrite = true; render(); }

  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>

</body>
</html>
